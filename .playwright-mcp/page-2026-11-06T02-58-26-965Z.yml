  - generic [ref=e282]:
    - generic [ref=e283]:
      - paragraph [ref=e284]: In 2005, Y Combinator developed a new model of startup funding. Four times a year we invest $500k in a select group of startups. They move to San Francisco for three months, where we work intensively with them to get the company into the best possible shape, before they present to a large audience of investors on Demo Day.
      - paragraph [ref=e285]: But YC doesn’t end on Demo Day. We and the YC alumni network continue to help founders for the life of their company, and beyond.
